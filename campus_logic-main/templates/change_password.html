{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block breadcrumb %}Change password{% endblock %}
{% block content %}
<div class="page-heading"><div class="eyebrow"><span class="eyebrow-line"></span> ACCOUNT SECURITY</div><h1>Change <span>password.</span></h1><p>Choose a password with at least 12 characters.</p></div>
<section class="panel form-panel compact-form">
  <form method="post" class="stack-form">
    <div class="field"><label for="old_password">Current password</label><input id="old_password" name="old_password" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="12" autocomplete="new-password" required></div>
    <div class="field"><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></div>
    <button class="button button-primary" type="submit">Update password <span>→</span></button>
  </form>
</section>
{% endblock %}
